name: apsrtc_mobile
description: A new Flutter project for Amma Travels Bus Booking.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.5
  firebase_messaging: ^15.2.10
  google_fonts: ^8.2.1
  intl: ^0.18.1
  firebase_core: ^3.6.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/buses/

